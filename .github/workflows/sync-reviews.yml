name: Sync Google Reviews

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime via "Run workflow"

permissions:
  contents: write

concurrency:
  group: sync-reviews
  cancel-in-progress: true

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure on main branch
        run: |
          git checkout -B main
          git pull origin main

      - name: Fetch Reviews from Google Places API
        run: |
          node -e '
          const fs = require("fs");
          const apiKey = (process.env.GOOGLE_PLACES_API_KEY || "").trim();
          const targetId = (process.env.GOOGLE_PLACE_ID || "").trim();

          if (!apiKey || !targetId) {
            console.error("Missing GOOGLE_PLACES_API_KEY or GOOGLE_PLACE_ID secret.");
            process.exit(0);
          }

          const url = targetId.startsWith("ChIJ")
            ? `https://maps.googleapis.com/maps/api/place/details/json?place_id=${targetId}&fields=reviews,rating,user_ratings_total&key=${apiKey}`
            : `https://maps.googleapis.com/maps/api/place/details/json?cid=${targetId}&fields=reviews,rating,user_ratings_total&key=${apiKey}`;

          fetch(url)
            .then(res => res.json())
            .then(data => {
              console.log("Google API Status:", data.status);
              if (data.status !== "OK") {
                console.error("Google API Message:", data.error_message || "No additional error message");
              }

              const rawReviews = data.result?.reviews || [];
              if (rawReviews.length === 0) {
                console.log("No reviews returned by Google. Keeping existing reviews.json intact.");
                return;
              }

              const formatted = rawReviews.map(r => ({
                name: r.author_name,
                location: "Calgary, AB",
                projectType: "Verified Client",
                rating: r.rating,
                date: r.relative_time_description,
                text: r.text
              }));

              fs.writeFileSync("reviews.json", JSON.stringify(formatted, null, 2));
              console.log(`Successfully saved ${formatted.length} reviews to reviews.json`);
            })
            .catch(err => {
              console.error("Fetch request error:", err);
            });
          '
        env:
          GOOGLE_PLACES_API_KEY: \${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: \${{ secrets.GOOGLE_PLACE_ID }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force sync tracking onto the real main branch before acting
          git checkout main
          git pull origin main --rebase
          
          git add reviews.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync latest Google reviews [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in reviews.json to commit."
          fi
