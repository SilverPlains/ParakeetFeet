name: Sync Google Reviews

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime via "Run workflow"

permissions:
  contents: write

concurrency:
  group: sync-reviews
  cancel-in-progress: true

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure on main branch
        run: |
          git checkout -B main
          git pull origin main

      - name: Fetch Reviews from Google Places API
        run: |
          node -e '
          const fs = require("fs");

          // Clean environment secrets
          const apiKey = (process.env.GOOGLE_PLACES_API_KEY || "").trim();
          let placeId = (process.env.GOOGLE_PLACE_ID || "").trim();

          // Fallback to Silver Plains Electric Place ID if secret is unset or corrupted
          if (!placeId || !placeId.startsWith("ChIJ")) {
            placeId = "ChIJcTFr73brlyQR2Gm0CWe6zL0";
          }

          if (!apiKey) {
            console.error("Missing GOOGLE_PLACES_API_KEY secret in GitHub.");
            process.exit(1);
          }

          console.log("Using verified Place ID:", placeId);

          async function fetchReviews() {
            // Attempt 1: Standard Places API
            try {
              const legacyUrl = "https://maps.googleapis.com/maps/api/place/details/json?place_id=" + encodeURIComponent(placeId) + "&fields=reviews,rating,user_ratings_total&key=" + apiKey;
              const res = await fetch(legacyUrl);
              const data = await res.json();

              console.log("Legacy API Status:", data.status);
              if (data.status === "OK" && Array.isArray(data.result?.reviews) && data.result.reviews.length > 0) {
                return data.result.reviews.map(r => ({
                  name: r.author_name,
                  location: "Calgary, AB",
                  projectType: "Verified Client",
                  rating: r.rating,
                  date: r.relative_time_description,
                  text: r.text
                }));
              }

              if (data.error_message) {
                console.log("Legacy API Message:", data.error_message);
              }
            } catch (err) {
              console.log("Legacy endpoint failed:", err.message);
            }

            // Attempt 2: Google Places API (New v1 endpoint)
            try {
              console.log("Attempting New Places API (v1)...");
              const newUrl = "https://places.googleapis.com/v1/places/" + placeId + "?fields=reviews,rating,userRatingCount";
              const res2 = await fetch(newUrl, {
                headers: {
                  "Content-Type": "application/json",
                  "X-Goog-Api-Key": apiKey,
                  "X-Goog-FieldMask": "reviews,rating,userRatingCount"
                }
              });
              const data2 = await res2.json();

              if (Array.isArray(data2.reviews) && data2.reviews.length > 0) {
                return data2.reviews.map(r => ({
                  name: r.authorAttribution?.displayName || "Google Reviewer",
                  location: "Calgary, AB",
                  projectType: "Verified Client",
                  rating: r.rating,
                  date: r.relativePublishTimeDescription || "",
                  text: r.originalText?.text || r.text?.text || ""
                }));
              }
              console.log("New API Response:", JSON.stringify(data2));
            } catch (err) {
              console.log("New API endpoint failed:", err.message);
            }

            return null;
          }

          fetchReviews().then(reviews => {
            if (reviews && reviews.length > 0) {
              fs.writeFileSync("reviews.json", JSON.stringify(reviews, null, 2));
              console.log("Successfully saved " + reviews.length + " reviews to reviews.json");
            } else {
              console.log("No new reviews parsed. Leaving reviews.json as-is.");
            }
          });
          '
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync latest Google reviews [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in reviews.json to commit."
          fi
