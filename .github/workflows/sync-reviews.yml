name: Sync Google Reviews

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime via "Run workflow"

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main         # Explicitly pull the main branch
          fetch-depth: 0    # Pull full history so rebasing is possible

      - name: Fetch Reviews from Google Places API
        run: |
          node -e '
          const fs = require("fs");
          const apiKey = (process.env.GOOGLE_PLACES_API_KEY || "").trim();
          const targetId = (process.env.GOOGLE_PLACE_ID || "").trim();

          if (!apiKey || !targetId) {
            console.error("Missing API key or Place ID secrets");
            process.exit(0);
          }

          const url = targetId.startsWith("ChIJ")
            ? `https://googleapis.com{targetId}&fields=reviews,rating,user_ratings_total&key=${apiKey}`
            : `https://googleapis.com{targetId}&fields=reviews,rating,user_ratings_total&key=${apiKey}`;

          fetch(url)
            .then(res => res.json())
            .then(data => {
              if (data.status !== "OK" && data.status !== undefined) {
                console.error("Google API status:", data.status, data.error_message || "");
              }

              const rawReviews = data.result?.reviews || [];
              const formatted = rawReviews.map(r => ({
                name: r.author_name,
                location: "Calgary, AB",
                projectType: "Verified Client",
                rating: r.rating,
                date: r.relative_time_description,
                text: r.text
              }));

              fs.writeFileSync("reviews.json", JSON.stringify(formatted, null, 2));
              console.log(`Saved ${formatted.length} reviews to reviews.json`);
            })
            .catch(err => {
              console.error("Fetch error:", err);
            });
          '
        env:
          GOOGLE_PLACES_API_KEY: \${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: \${{ secrets.GOOGLE_PLACE_ID }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force git to bind our local workspace tracking to the live remote main branch
          git checkout main
          git pull origin main --rebase
          
          git add reviews.json
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync latest Google reviews [skip ci]"
            # Double check upstream updates one last split-second before pushing
            git pull origin main --rebase
            git push origin main
          else
            echo "No changes in reviews.json to commit."
          fi
